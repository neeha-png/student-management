<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

    <header>
        <h2>Student Management System</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="add-student.html" class="active">Add Student</a>
            <a href="students.html">Student List</a>
            <a href="attendance.html">Attendance</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <h1>Add Student</h1>
        <p class="subtitle">Enter the student details and press Save.</p>

        <div id="alertBox" class="alert alert-success" hidden></div>

        <form id="studentForm" class="panel" novalidate>
            <div class="form-grid">

                <div>
                    <label for="rollNo">Roll Number</label>
                    <input type="text" id="rollNo" autocomplete="off" placeholder="e.g. CS101">
                    <span class="error" id="err-rollNo"></span>
                </div>

                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" autocomplete="off" placeholder="e.g. Asha Reddy">
                    <span class="error" id="err-name"></span>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="off" placeholder="e.g. asha@example.com">
                    <span class="error" id="err-email"></span>
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" autocomplete="off" placeholder="10 digits" maxlength="10">
                    <span class="error" id="err-phone"></span>
                </div>

                <div>
                    <label for="course">Course</label>
                    <input type="text" id="course" list="courseList" autocomplete="off" placeholder="e.g. B.Tech CSE">
                    <datalist id="courseList"></datalist>
                    <span class="error" id="err-course"></span>
                </div>

                <div>
                    <label for="year">Year</label>
                    <select id="year">
                        <option value="">Select year</option>
                        <option value="1">1 YEAR</option>
                        <option value="2">2 YEAR</option>
                        <option value="3">3 YEAR</option>
                        <option value="4">4 YEAR</option>
                    </select>
                    <span class="error" id="err-year"></span>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Student</button>
                <button type="reset" class="btn btn-secondary" id="resetBtn">Clear Form</button>
            </div>
        </form>
    </main>

    <footer>
        <p>Student Management System</p>
    </footer>

    <script src="js/add-student.js"></script>
</body>
</html>
