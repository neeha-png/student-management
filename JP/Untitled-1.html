<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System - Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        /* Header */
        header {
            background: #a96843;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 18px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 5px;
        }

        nav a:hover,
        nav a.active {
            background: #c18b67;
        }

        /* Main Content */
        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 20px;
        }

        .container h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        /* Attendance Card */
        .attendance-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .controls {
            display: flex;
            align-items: end;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .date-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .date-box label {
            font-weight: bold;
        }

        input[type="date"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            border: none;
            padding: 11px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .mark-btn {
            background: #eeeeee;
            color: #333;
        }

        .mark-btn:hover {
            background: #ddd;
        }

        /* Message */
        #dateMessage {
            color: #777;
            font-size: 14px;
            margin: 15px 0;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #a96843;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background: #faf5f1;
        }

        .status-option {
            margin-right: 12px;
            white-space: nowrap;
        }

        input[type="radio"] {
            accent-color: #a96843;
            cursor: pointer;
        }

        .present {
            color: #a96843;
        }

        .absent {
            color: #333;
        }

        /* Summary */
        .summary {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-weight: bold;
            flex-wrap: wrap;
        }

        .save-btn {
            background: #a96843;
            color: white;
            margin-top: 25px;
            padding: 13px 30px;
        }

        .save-btn:hover {
            background: #874d2d;
        }

        #successMessage {
            color: green;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #a96843;
            color: white;
            padding: 18px;
            text-align: center;
            margin-top: 30px;
        }

        @media(max-width: 600px) {
            .container {
                padding: 12px;
            }

            .attendance-card {
                padding: 15px;
            }

            nav {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Student Management System</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="add-student.html">Add Student</a>
            <a href="student-list.html">Student List</a>
            <a href="attendance.html" class="active">Attendance</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <!-- Main Section -->
    <main class="container">

        <h2>Attendance</h2>

        <p class="subtitle">
            Choose a date, mark each student and press Save Attendance.
        </p>

        <div class="attendance-card">

            <!-- Date and Buttons -->
            <div class="controls">

                <div class="date-box">
                    <label for="attendanceDate">Date</label>
                    <input type="date" id="attendanceDate">
                </div>

                <button class="mark-btn" id="markPresent">
                    Mark all present
                </button>

                <button class="mark-btn" id="markAbsent">
                    Mark all absent
                </button>

            </div>

            <p id="dateMessage"></p>

            <!-- Attendance Table -->
            <div class="table-wrapper">
                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Overall</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTable">
                    </tbody>

                </table>
            </div>

            <!-- Summary -->
            <div class="summary">

                <span>
                    Present: <span id="presentCount">0</span>
                </span>

                <span>
                    Absent: <span id="absentCount">0</span>
                </span>

            </div>

            <button class="save-btn" id="saveAttendance">
                Save Attendance
            </button>

            <p id="successMessage"></p>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        Student Management System
    </footer>

    <script src="attendance.js"></script>

</body>
</html>
