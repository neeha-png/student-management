
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student Details</title>
    <link rel="stylesheet" href="css/students.css">
</head>
<body>

<header>
    <h2>Student Management System</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="add-student.html">Add Student</a>
        <a href="students.html" class="active">Student List</a>
        <a href="attendance.html">Attendance</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>
    <h1>Edit Student Details</h1>
    <p class="subtitle">Modify the student information and save changes.</p>

    <div class="panel">

        <form id="editStudentForm">

            <div class="form-grid">

                <div>
                    <label for="rollNo">Roll Number</label>
                    <input type="text" id="rollNo" required>
                </div>

                <div>
                    <label for="name">Student Name</label>
                    <input type="text" id="name" required>
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>

                <div>
                    <label for="course">Course</label>
                    <input type="text" id="course" required>
                </div>

                <div>
                    <label for="year">Academic Year</label>
                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Update Student
                </button>

                <a href="students.html" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</main>

<footer>
    <p>Student Management System</p>
</footer>

<script src="js/edit-student.js"></script>

</body>
</html>
